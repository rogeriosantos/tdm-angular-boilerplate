<div class="dashboard-container">
  <!-- Machine Operator Toolbar Header -->
  <app-toolbar></app-toolbar>

  <!-- Selection Bar (Cost Unit + Workplace) -->
  <app-selection-bar
    (selectionChanged)="onSelectionChanged($event)"
    (costUnitChanged)="onCostUnitChanged($event)"
    (workplaceChanged)="onWorkplaceChanged($event)"
  ></app-selection-bar>

  <!-- Bookings Table (always visible) -->
  <main class="dashboard-content">
    <app-bookings-table
      [toolItems]="toolItems"
      [toolAssemblies]="toolAssemblies"
      [loading]="loadingBookings"
      [hasCostUnit]="!!selectedCostUnitId"
      [hasWorkplace]="!!selectedWorkplaceId"
      [totalCount]="totalBookingCount"
      (refresh)="onRefreshBookings()"
      (pageChange)="onPageChange($event)"
      (filterChange)="onFilterChange($event)"
    ></app-bookings-table>
  </main>
</div>
