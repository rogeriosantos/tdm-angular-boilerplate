<div class="dashboard-container" *transloco="let t">
  <!-- Machine Operator Toolbar Header -->
  <app-toolbar></app-toolbar>

  <!-- Selection Bar (Cost Unit + Workplace) -->
  <app-selection-bar
    [initialCostUnit]="savedCostUnit"
    [initialWorkplace]="savedWorkplace"
    (selectionChanged)="onSelectionChanged($event)"
    (costUnitChanged)="onCostUnitChanged($event)"
    (workplaceChanged)="onWorkplaceChanged($event)"
  ></app-selection-bar>

  <!-- Tabs: Unconfirmed / History -->
  <main class="dashboard-content">
    <mat-tab-group (selectedTabChange)="onTabChange($event)">
      <!-- Unconfirmed Tab -->
      <mat-tab [label]="t('bookings.tab-unconfirmed')">
        <app-bookings-table
          #bookingsTable
          mode="unconfirmed"
          [toolItems]="toolItems"
          [toolAssemblies]="toolAssemblies"
          [loading]="loadingBookings"
          [hasCostUnit]="!!selectedCostUnitId"
          [hasWorkplace]="!!selectedWorkplaceId"
          [selectedCostUnit]="selectedCostUnitId || ''"
          [readOnly]="false"
          (refresh)="onRefreshBookings()"
          (confirmBookings)="onConfirmBookings()"
        ></app-bookings-table>
      </mat-tab>

      <!-- History Tab -->
      <mat-tab [label]="t('bookings.tab-history')">
        <app-bookings-table
          mode="history"
          [toolItems]="historyToolItems"
          [toolAssemblies]="historyToolAssemblies"
          [loading]="loadingHistory"
          [hasCostUnit]="!!selectedCostUnitId"
          [hasWorkplace]="!!selectedWorkplaceId"
          [selectedCostUnit]="selectedCostUnitId || ''"
          [readOnly]="true"
          [dateRanges]="dateRanges"
          [selectedDateRange]="selectedDateRange"
          (dateRangeChange)="onDateRangeChange($event)"
          (refresh)="onRefreshHistory()"
        ></app-bookings-table>
      </mat-tab>
    </mat-tab-group>
  </main>
</div>
