<div class="flex flex-row bg-white border-t-2 border-gray-200 p-4 shadow-md">
  <div class="basis-1/3"></div>
  <div class="basis-1/3">
    <div class="flex-grow flex justify-center items-center space-x-4">
      <!-- Cost Unit Selector -->
      <app-costunit-selector
        (costUnitSelected)="onCostUnitSelected($event)"
      ></app-costunit-selector>

      <!-- separator -->
      <div class="flex flex-col justify-end">
        <div class="arrow">➤</div>
      </div>

      <!-- Workplace Selector -->
      <app-workplace-selector
        [selectedCostUnit]="selectedCostUnit"
        (workplaceSelected)="onWorkplaceSelected($event)"
      ></app-workplace-selector>
    </div>
  </div>
  <div class="basis-1/3 ml-4 mt-1.5">
    <div>
      <button
        mat-flat-button
        [disabled]="!selectedCostUnit || !selectedWorkplace"
        (click)="onShowDetails()"
        class="details-button px-4 py-2 rounded-md hover:bg-gray-300 hover:text-white right_button"
      >
        Show Details
      </button>
    </div>
  </div>
</div>
