<div class="flex flex-row bg-white border-t-2 border-gray-200 p-4 shadow-md">
  <div class="basis-1/3"></div>
  <div class="basis-1/3">
    <div class="flex-grow flex justify-center items-center space-x-4">
      <!-- select costunit combobox -->
      <div class="flex flex-col w-96">
        <label for="costunit" class="text-gray-700 font-medium mb-1 flex items-center">
          <span class="mr-2">🏭</span>
          Cost Unit Select
        </label>

        <mat-form-field appearance="outline" class="custom-combobox">
          <input
            type="text"
            placeholder="Select a cost unit..."
            matInput
            [formControl]="selectCostUnitsControl"
            [matAutocomplete]="autoCostUnit"
          />
          <span
            matSuffix
            *ngIf="selectCostUnitsControl.value"
            (click)="clearCostUnitSelection($event)"
            class="cursor-pointer text-gray-500 hover:text-gray-700"
            >✕</span
          >
        </mat-form-field>

        <mat-autocomplete
          #autoCostUnit="matAutocomplete"
          [displayWith]="displayFnCostUnit"
          (optionSelected)="onCostUnitOptionSelected($event)"
        >
          <mat-option *ngFor="let option of mockCostUnits" [value]="option">
            <div class="option-content-costunit">
              <div class="costunit-icon">🏭</div>
              <div class="option-text">
                <div>{{ option.id }}</div>
                <div class="option-name">{{ option.name }}</div>
              </div>
            </div>
          </mat-option>
        </mat-autocomplete>
      </div>

      <!-- separator -->
      <div class="flex flex-col justify-end">
        <div class="arrow">➤</div>
      </div>

      <!-- Workplace selection combobox-->
      <div class="flex flex-col w-96">
        <label for="workplace" class="text-gray-700 font-medium mb-1 flex items-center">
          <span class="mr-2">🏢</span>
          Workplace
        </label>

        <mat-form-field appearance="outline" class="custom-combobox">
          <input
            type="text"
            placeholder="Select a workplace..."
            matInput
            [formControl]="selectWorkplacesControl"
            [matAutocomplete]="autoWorkplace"
            [disabled]="!selectedCostUnit"
          />
          <span
            matSuffix
            *ngIf="selectWorkplacesControl.value"
            (click)="clearWorkplaceSelection($event)"
            class="cursor-pointer text-gray-500 hover:text-gray-700"
            >✕</span
          >
        </mat-form-field>

        <mat-autocomplete
          #autoWorkplace="matAutocomplete"
          [displayWith]="displayFnWorkplace"
          (optionSelected)="onWorkplaceOptionSelected($event)"
        >
          <mat-option *ngFor="let option of filteredWorkplaces" [value]="option">
            <div class="option-content">
              <div>{{ option.id }}</div>
              <div class="job-description">{{ option.description }}</div>
            </div>
          </mat-option>
        </mat-autocomplete>
      </div>
    </div>
  </div>
  <div class="basis-1/3 ml-4 mt-1.5">
    <div>
      <button
        mat-flat-button
        [disabled]="!selectedWorkplace"
        class="job-details-button px-4 py-2 rounded-md hover:bg-gray-300 hover:text-white right_button"
      >
        Show Workplace Details
      </button>
    </div>
  </div>
</div>
